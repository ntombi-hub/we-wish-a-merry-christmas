<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Christmas Tree 🎄</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, #1b2a4a 0%, #0a1120 60%, #05070d 100%);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }

  /* twinkling stars in background */
  .star-bg {
    position: fixed;
    width: 2px; height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .tree {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* top star */
  .top-star {
    font-size: 40px;
    color: #ffd700;
    text-shadow: 0 0 10px #ffd700, 0 0 25px #ffaa00;
    animation: glow 1.5s ease-in-out infinite alternate;
    margin-bottom: -8px;
    z-index: 2;
  }
  @keyframes glow {
    from { text-shadow: 0 0 10px #ffd700, 0 0 20px #ffaa00; }
    to   { text-shadow: 0 0 20px #fff2a8, 0 0 45px #ffd700; }
  }

  /* tree layers */
  .layer {
    width: 0; height: 0;
    border-left:  solid transparent;
    border-right: solid transparent;
    border-bottom-style: solid;
    border-bottom-color: #0e6b34;
    position: relative;
    filter: drop-shadow(0 0 6px rgba(0,255,100,0.25));
  }

  .layer::after {
    content: '';
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      45deg,
      transparent 0px,
      transparent 10px,
      rgba(255,255,255,0.04) 10px,
      rgba(255,255,255,0.04) 12px
    );
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }

  .layer1 { border-left-width: 70px;  border-right-width: 70px;  border-bottom-width: 90px;  border-bottom-color: #0b5a2b; }
  .layer2 { border-left-width: 90px;  border-right-width: 90px;  border-bottom-width: 110px; border-bottom-color: #0e6b34; margin-top: -35px; }
  .layer3 { border-left-width: 110px; border-right-width: 110px; border-bottom-width: 130px; border-bottom-color: #118040; margin-top: -35px; }
  .layer4 { border-left-width: 130px; border-right-width: 130px; border-bottom-width: 150px; border-bottom-color: #149a4c; margin-top: -35px; }

  /* ornaments */
  .ornament {
    position: absolute;
    width: 12px; height: 12px;
    border-radius: 50%;
    animation: blink 2s infinite;
    z-index: 3;
  }
  @keyframes blink {
    0%, 100% { opacity: 1;   filter: brightness(1.4); }
    50%      { opacity: 0.55; filter: brightness(0.8); }
  }

  /* trunk */
  .trunk {
    width: 34px; height: 46px;
    background: linear-gradient(90deg, #5a3a1a, #8b5a2b, #5a3a1a);
    border-radius: 0 0 6px 6px;
    margin-top: -6px;
  }

  /* ground */
  .ground {
    width: 340px; height: 24px;
    background: radial-gradient(ellipse at center, rgba(180,230,255,0.35), transparent 70%);
    border-radius: 50%;
    margin-top: -12px;
  }

  /* snowflakes */
  .snow {
    position: fixed;
    top: -10px;
    color: #fff;
    font-size: 14px;
    animation: fall linear infinite;
    pointer-events: none;
    opacity: 0.85;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); }
    100% { transform: translateY(110vh) translateX(40px) rotate(360deg); }
  }

  .greeting {
    color: #fff;
    margin-top: 24px;
    font-size: 24px;
    letter-spacing: 3px;
    text-shadow: 0 0 12px #ffd700, 0 0 25px #ff6b6b;
    animation: glow 2s ease-in-out infinite alternate;
  }
</style>
</head>
<body>

  <div class="tree">
    <div class="top-star">★</div>

    <div class="layer layer1">
      <span class="ornament" style="background:#ff3b3b; top:40px; left:50%; transform:translateX(-50%); box-shadow:0 0 8px #ff3b3b;"></span>
      <span class="ornament" style="background:#ffd700; top:65px; left:25%; box-shadow:0 0 8px #ffd700; animation-delay:.4s;"></span>
      <span class="ornament" style="background:#3bb0ff; top:65px; left:65%; box-shadow:0 0 8px #3bb0ff; animation-delay:.8s;"></span>
    </div>

    <div class="layer layer2">
      <span class="ornament" style="background:#ff6b6b; top:35px; left:30%; box-shadow:0 0 8px #ff6b6b; animation-delay:.2s;"></span>
      <span class="ornament" style="background:#ffe066; top:75px; left:55%; box-shadow:0 0 8px #ffe066; animation-delay:.6s;"></span>
      <span class="ornament" style="background:#7bff6b; top:55px; left:70%; box-shadow:0 0 8px #7bff6b; animation-delay:1s;"></span>
    </div>

    <div class="layer layer3">
      <span class="ornament" style="background:#ff5fa2; top:50px; left:22%; box-shadow:0 0 8px #ff5fa2; animation-delay:.3s;"></span>
      <span class="ornament" style="background:#ffd700; top:90px; left:48%; box-shadow:0 0 8px #ffd700; animation-delay:.9s;"></span>
      <span class="ornament" style="background:#3bb0ff; top:65px; left:72%; box-shadow:0 0 8px #3bb0ff; animation-delay:.5s;"></span>
    </div>

    <div class="layer layer4">
      <span class="ornament" style="background:#ff3b3b; top:60px; left:30%; box-shadow:0 0 8px #ff3b3b; animation-delay:.1s;"></span>
      <span class="ornament" style="background:#ffe066; top:105px; left:50%; box-shadow:0 0 8px #ffe066; animation-delay:.7s;"></span>
      <span class="ornament" style="background:#7bff6b; top:80px; left:68%; box-shadow:0 0 8px #7bff6b; animation-delay:1.1s;"></span>
      <span class="ornament" style="background:#ff5fa2; top:40px; left:55%; box-shadow:0 0 8px #ff5fa2; animation-delay:.4s;"></span>
    </div>

    <div class="trunk"></div>
    <div class="ground"></div>
  </div>

  <div class="greeting">Merry Christmas!</div>

<script>
  // twinkling background stars
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star-bg';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top  = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.opacity = Math.random();
    document.body.appendChild(s);
  }

  // falling snowflakes
  const flakes = ['❄', '❅', '❆', '•'];
  setInterval(() => {
    const s = document.createElement('div');
    s.className = 'snow';
    s.textContent = flakes[Math.floor(Math.random() * flakes.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = (8 + Math.random() * 14) + 'px';
    s.style.animationDuration = (5 + Math.random() * 6) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 12000);
  }, 250);
</script>

</body>
</html>
